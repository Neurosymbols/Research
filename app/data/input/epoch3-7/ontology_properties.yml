object_properties:
  - name: hasSpecification

  - name: hasObservation

  - name: observationOf
    functional: true
    inverse_of: hasObservation
  
  - name: evaluatesObservation

  - name: evaluatesAgainst
    functional: true
    inverse_of: evaluatesObservation

  - name: hasFailureCause

  - name: hasCorrectiveAction

  - name: monitorsDefect

  - name: violatesSpecification

  - name: hasDefect

  - name: defectOccursOn
    functional: true
    inverse_of: hasDefect

  - name: affects

  - name: relatedObservation

  - name: triggeredByRule

  - name: supportedBy

  - name: causallyInfluencedBy
    transitive: true

  - name: causallyInfluences
    inverse_of: causallyInfluencedBy
    transitive: true
  
  - name: hasCorrectiveAction

data_properties:
  - name: hasUpperValue
    functional: true
    range: float

  - name: hasNominalValue
    functional: true
    range: float

  - name: hasLowerValue
    functional: true
    range: float

  - name: hasObservedValue
    functional: true
    range: float

  - name: hasUnit
    functional: true
    range: str

  - name: hasSeverity
    functional: true
    range: int

  - name: hasWeight
    functional: true
    range: float
    
  - name: flagCount
    functional: true
    range: int
  
  - name: interactionBonus
    functional: true
    range: int
  
  - name: hasRBIScore
    functional: true
    range: float
