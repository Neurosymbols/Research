object_properties:
  - name: hasSpecification
    domain: MaterialProduct
    range: QualityObservation

  - name: specificationOf
    inverse_of: hasObservation

  - name: hasFailureCause
    domain: MaterialProduct
    range: FailureCause

  - name: hasDefect
    domain: MaterialProduct
    range: Defect

  - name: hasCorrectiveAction
    domain: FailureCause
    range: CorrectiveAction

  - name: isFailureCauseOf
    domain: FailureCause
    range: Defect

  - name: isCausedBy
    inverse_of: isFailureCauseOf

data_properties:
  - name: hasUpperValue
    domain: QualitySpecification
    range: float

  - name: hasNominalValue
    domain: QualitySpecification
    range: float

  - name: hasLowerValue
    domain: QualitySpecification
    range: float

  - name: hasObservedValue
    domain: QualityObservation
    range: float

  - name: hasUnit
    domain: QualityObservation
    range: string

  - name: hasSeverity
    domain: FailureCause
    range: int

  - name: hasWeight
    domain: FailureCause
    range: float

  - name: hasRBIScore
    domain: MaterialProduct
    range: float
